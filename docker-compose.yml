version: '3.9'

networks:
  fake-bolt-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
  zookeeper-secrets:
  kafka-secrets:
  prometheus-data:
  grafana-data:
  loki-data:
  logs-data:
  floci-data:

services:

  # ─────────────────────────────────────────
  # INFRASTRUCTURE
  # ─────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      # both folders must persist together with kafka-data: the transaction log lives in /log, and
      # an anonymous volume there loses the cluster id on recreate, so Kafka exits with
      # InconsistentClusterIdException
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
      # the image declares this folder as a volume too; named, so `down -v` removes it instead of leaking it
      - zookeeper-secrets:/etc/zookeeper/secrets
    networks:
      - fake-bolt-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka-data:/var/lib/kafka/data
      # declared as a volume by the image; named so it doesn't leak as an anonymous volume
      - kafka-secrets:/etc/kafka/secrets
    networks:
      - fake-bolt-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - fake-bolt-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # FAKE AWS (Floci) - S3 for profile photos
  # ─────────────────────────────────────────

  floci:
    image: floci/floci:latest-compat
    container_name: floci
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      S3_BUCKET: fake-bolt-profile-photos
      SES_SENDER: no-reply@fakebolt.local
    volumes:
      - floci-data:/app/data
      - ./floci/init/ready.d:/etc/floci/init/ready.d:ro
    networks:
      - fake-bolt-network

  # ─────────────────────────────────────────
  # DATABASE (single instance, multiple DBs)
  # ─────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - fake-bolt-network
    healthcheck:
      # -d: without it pg_isready probes a database named after the user ("fakebolt"), which logs a FATAL every 10s
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # MICROSERVICES
  # ─────────────────────────────────────────

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    # compose doesn't wait for Kafka/Postgres to be ready; a service that boots too early exits and is restarted
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      DRIVER_SERVICE_URL: http://driver-service:3002
      RIDER_SERVICE_URL: http://rider-service:3003
      RIDE_SERVICE_URL: http://ride-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3006
      EMAIL_SERVICE_URL: http://email-service:3008
      JWT_SECRET: ${JWT_SECRET}
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
    depends_on:
      - auth-service
      - driver-service
      - rider-service
      - ride-service
      - payment-service
      - email-service
    volumes:
      - logs-data:/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - fake-bolt-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: on-failure
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      KAFKA_BROKER: kafka:9092
      S3_ENDPOINT: http://floci:4566
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:4566}
      S3_BUCKET: fake-bolt-profile-photos
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      - postgres
      - kafka
      - floci
    volumes:
      - logs-data:/logs
    networks:
      - fake-bolt-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  driver-service:
    build:
      context: ./driver-service
      dockerfile: Dockerfile
    container_name: driver-service
    restart: on-failure
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/driver_db
      KAFKA_BROKER: kafka:9092
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
      - kafka
      - redis
    volumes:
      - logs-data:/logs
    networks:
      - fake-bolt-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  rider-service:
    build:
      context: ./rider-service
      dockerfile: Dockerfile
    container_name: rider-service
    restart: on-failure
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/rider_db
      KAFKA_BROKER: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
      - kafka
    volumes:
      - logs-data:/logs
    networks:
      - fake-bolt-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  matching-service:
    build:
      context: ./matching-service
      dockerfile: Dockerfile
    container_name: matching-service
    restart: on-failure
    environment:
      PORT: 3005
      KAFKA_BROKER: kafka:9092
      REDIS_URL: redis://redis:6379
      SEARCH_RADIUS_KM: 5
    depends_on:
      - kafka
      - redis
    volumes:
      - logs-data:/logs
    networks:
      - fake-bolt-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3005/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  ride-service:
    build:
      context: ./ride-service
      dockerfile: Dockerfile
    container_name: ride-service
    restart: on-failure
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ride_db
      KAFKA_BROKER: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
      - kafka
    volumes:
      - logs-data:/logs
    networks:
      - fake-bolt-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    restart: on-failure
    ports:
      - "3007:3007"
    environment:
      PORT: 3007
      KAFKA_BROKER: kafka:9092
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - kafka
      - redis
    volumes:
      - logs-data:/logs
    networks:
      - fake-bolt-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3007/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  email-service:
    build:
      context: ./email-service
      dockerfile: Dockerfile
    container_name: email-service
    restart: on-failure
    environment:
      PORT: 3008
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/email_db
      KAFKA_BROKER: kafka:9092
      AUTH_SERVICE_URL: http://auth-service:3001
      SES_ENDPOINT: http://floci:4566
      SES_REGION: us-east-1
      SES_SENDER: no-reply@fakebolt.local
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      - postgres
      - kafka
      - floci
      - auth-service
    volumes:
      - logs-data:/logs
    networks:
      - fake-bolt-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3008/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    restart: on-failure
    environment:
      PORT: 3006
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/payment_db
      KAFKA_BROKER: kafka:9092
      REDIS_URL: redis://redis:6379
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
      - kafka
      - redis
    volumes:
      - logs-data:/logs
    networks:
      - fake-bolt-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3006/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # SEED
  # ─────────────────────────────────────────

  seed:
    build:
      context: ./seed
      dockerfile: Dockerfile
    container_name: seed
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      DRIVER_SERVICE_URL: http://driver-service:3002
      RIDER_SERVICE_URL: http://rider-service:3003
      SEED_RIDERS: 200
      SEED_DRIVERS: 100
    depends_on:
      - auth-service
      - driver-service
      - rider-service
    networks:
      - fake-bolt-network
    restart: 'no'

  # ─────────────────────────────────────────
  # EXPORTERS
  # ─────────────────────────────────────────

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis
    networks:
      - fake-bolt-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable"
    depends_on:
      - postgres
    networks:
      - fake-bolt-network

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    # starts before Kafka accepts connections and exits; retry instead of staying down
    restart: on-failure
    command:
      - --kafka.server=kafka:9092
    depends_on:
      - kafka
    networks:
      - fake-bolt-network

  # ─────────────────────────────────────────
  # OBSERVABILITY
  # ─────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "9090:9090"
    command:
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=1d'
      - '--storage.tsdb.retention.size=512MB'
      - '--storage.tsdb.path=/prometheus'
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    networks:
      - fake-bolt-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3300:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      # read-only anonymous access, off by default (GRAFANA_ANONYMOUS=true for headless screenshots)
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      # data sources + dashboard provider, and the dashboard JSON files they load
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - fake-bolt-network

  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    networks:
      - fake-bolt-network

  grafana-alloy:
    image: grafana/alloy:latest
    container_name: grafana-alloy
    volumes:
      - ./grafana/alloy-config.alloy:/etc/alloy/config.alloy
      - logs-data:/logs:ro
    depends_on:
      - loki
      - prometheus
      - kafka
      - kafka-exporter
      - redis-exporter
      - postgres-exporter
      - gateway
      - auth-service
      - driver-service
      - rider-service
      - ride-service
      - matching-service
      - payment-service
      - notification-service
      - email-service
    networks:
      - fake-bolt-network

  # ─────────────────────────────────────────
  # K6 (custom image with Socket.io, runs last, exits when the test ends)
  # ─────────────────────────────────────────

  k6:
    build:
      context: ./k6
      dockerfile: Dockerfile
    container_name: k6
    profiles:
      - testing
    depends_on:
      - gateway
      - auth-service
      - driver-service
      - ride-service
      - matching-service
      - notification-service
      - email-service
      - floci
      - seed
      - prometheus
    environment:
      GATEWAY_URL: http://gateway:3000
      # the entrypoint waits for every service the test calls, not only the gateway
      WAIT_FOR: http://gateway:3000 http://auth-service:3001 http://driver-service:3002 http://ride-service:3004 http://matching-service:3005 http://notification-service:3007 http://email-service:3008
      NOTIFICATION_URL: http://notification-service:3007
      DRIVER_SERVICE_URL: http://driver-service:3002
      RIDE_SERVICE_URL: http://ride-service:3004
      S3_URL: http://floci:4566
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99),avg,max
    volumes:
      - ./k6/k6.test.fake.bolt.js:/scripts/k6.test.fake.bolt.js:ro
      - ./k6/fixtures:/scripts/fixtures:ro
      - ./k6_reports:/reports
    command: ["/scripts/k6.test.fake.bolt.js"]
    restart: "no"
    networks:
      - fake-bolt-network
